<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17375e">
<meta name="robots" content="noindex,nofollow">
<title>Administrator Login | D’Blossom Model Private Schools</title>
<link rel="icon" href="/logo.jpeg">
<link rel="stylesheet" href="/css/style.css?v=20261010-final-audit-1">
<link rel="stylesheet" href="/css/portal.css?v=20261010-final-audit-1">
<link rel="stylesheet" href="/css/portal-refresh.css?v=20261010-final-audit-1">
<link rel="stylesheet" href="/css/admin-login.css?v=20261109-center-card-2">
</head>
<body class="portal-page" data-role="admin">
<main class="portal-login">
  <section class="portal-login-card" aria-labelledby="admin-login-title">
    <div class="portal-login-brand">
      <a class="admin-login-logo" href="/" aria-label="Return to school website">
        <img src="/logo.jpeg" alt="D’Blossom Model Private Schools logo">
      </a>
      <p class="portal-eyebrow">D’BLOSSOM MODEL PRIVATE SCHOOLS</p>
      <h1 id="admin-login-title">Administrator Portal</h1>
    </div>
    <div class="admin-login-heading">
      <h2>Welcome back</h2>
      <p class="portal-intro">Enter your administrator username and password.</p>
    </div>
    <form id="admin-login-form" class="portal-login-form" novalidate>
      <label class="portal-field" for="admin-username">
        <span>Username</span>
        <input id="admin-username" name="username" autocomplete="username" required autofocus placeholder="Administrator username">
      </label>
      <label class="portal-field" for="admin-password">
        <span>Password</span>
        <span class="portal-password">
          <input id="admin-password" name="password" type="password" autocomplete="current-password" required placeholder="Administrator password">
          <button class="portal-show" type="button" data-toggle-password aria-label="Show password" aria-pressed="false">Show</button>
        </span>
      </label>
      <div id="admin-login-status" class="portal-status" role="status" aria-live="polite"></div>
      <button class="btn navy-btn portal-login-btn" type="submit" id="admin-login-submit">Sign in to Administrator Portal</button>
    </form>
    <p class="portal-help">Secure administrator access. Never share your password.</p>
    <a class="portal-back" href="/">← Back to school website</a>
  </section>
</main>
<script src="/js/admin-login-html.js?v=20261109-center-card-2"></script>
</body>
</html>
