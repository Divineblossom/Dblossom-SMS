<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admissions — D'Blossom Model Private Schools</title>
<link rel="icon" type="image/jpeg" href="/logo.jpg">
<link rel="shortcut icon" type="image/jpeg" href="/logo.jpg">
<link rel="stylesheet" href="/css/style.css?v=20261010-final-audit-1"><link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
<main class="login-main admissions-page">
<section class="login-card admission-card">
<div class="admission-heading">
<img class="admission-logo" src="/logo.jpg" alt="D'Blossom Model Private Schools logo">
<p class="eyebrow">D'Blossom Model Private Schools</p>
<h1>Online Admission Application</h1>
<p class="muted">Complete all applicable fields carefully. Your application will be submitted securely to the school for review.</p>
</div>
<form id="admission-form" class="dashboard-form admission-form">
<div class="admission-form-section">
<h2>Applicant Information</h2>
<div class="admission-field-grid">
<label class="field"><span>Applicant Full Name *</span><input name="applicant_name" required placeholder="Enter applicant's full name"></label>
<label class="field"><span>Date of Birth</span><input name="date_of_birth" type="date"></label>
<label class="field"><span>Gender</span><select name="gender"><option value="">Select gender</option><option>Male</option><option>Female</option></select></label>
<label class="field"><span>Class Applying For</span><input name="class_applied" placeholder="e.g. JSS 1"></label>
</div>
</div>
<div class="admission-form-section">
<h2>Parent / Guardian Information</h2>
<div class="admission-field-grid">
<label class="field"><span>Parent / Guardian Full Name *</span><input name="parent_name" required placeholder="Enter parent or guardian full name"></label>
<label class="field"><span>Parent Email</span><input name="parent_email" type="email" placeholder="Enter parent email"></label>
<label class="field"><span>Parent / Guardian Phone</span><input name="parent_phone" type="tel" placeholder="Enter phone number"></label>
</div>
<label class="field"><span>Residential Address</span><textarea name="address" rows="4" placeholder="Enter residential address"></textarea></label>
</div>
<div class="admission-actions">
<button class="btn btn-gold" type="submit">Submit Application</button>
<button class="btn navy-btn" type="button" id="download-empty-admission-form">Download Empty Form</button>
<a class="btn btn-outline-print" href="/pages/admission-status.html">Check Admission Status</a>
</div>
<p id="admission-notice" class="notice"></p>
</form>
<p class="admission-links"><a href="/">← Back to Home</a> · <a href="/pages/admission-status.html">Check application status</a></p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script type="module" src="/js/admissions.js"></script>
</body>
</html>
